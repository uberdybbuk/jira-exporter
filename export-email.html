<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="utf-8">
</head>
<body style="margin: 0; padding: 24px; background: #f4f4f5; font-family: Segoe UI, Arial, sans-serif; font-size: 14px; color: #27272a;">
    <table role="presentation" cellpadding="0" cellspacing="0" style="max-width: 560px; width: 100%; background: #ffffff; border: 1px solid #e4e4e7;">
        <tr>
            <td style="padding: 20px 24px 8px; font-size: 18px; font-weight: 600;">Jira export'u</td>
        </tr>
        <tr>
            <td style="padding: 0 24px 16px; color: #52525b;">Dosya ekte. Horizon'a içe aktarılmak üzere gönderildi.</td>
        </tr>
        <tr>
            <td style="padding: 0 24px 24px;">
                <table role="presentation" cellpadding="6" cellspacing="0" style="width: 100%; border-collapse: collapse;">
                    <tr style="border-top: 1px solid #e4e4e7;">
                        <td style="width: 160px; color: #71717a;">Dosya</td>
                        <td>{{FileName}}</td>
                    </tr>
                    <tr style="border-top: 1px solid #e4e4e7;">
                        <td style="color: #71717a;">Tür</td>
                        <td>{{Mode}}</td>
                    </tr>
                    <tr style="border-top: 1px solid #e4e4e7;">
                        <td style="color: #71717a;">Export zamanı</td>
                        <td>{{ExportedAt}}</td>
                    </tr>
                    <tr style="border-top: 1px solid #e4e4e7;">
                        <td style="color: #71717a;">Önceki export</td>
                        <td>{{PreviousExportAt}}</td>
                    </tr>
                    <tr style="border-top: 1px solid #e4e4e7;">
                        <td style="color: #71717a;">Work package</td>
                        <td>{{WorkPackageCount}}</td>
                    </tr>
                    <tr style="border-top: 1px solid #e4e4e7; border-bottom: 1px solid #e4e4e7;">
                        <td style="color: #71717a;">Kaynaktan kalkan</td>
                        <td>{{RemovedCount}}</td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
